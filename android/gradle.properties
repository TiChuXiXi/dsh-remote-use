# DshRemote — Gradle properties.
#
# This machine's / is mounted read-only, so neither ~/.gradle nor /opt is writable.
# android/gradlew sets GRADLE_USER_HOME to .toolchain/gradle-home inside the project.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The real aapt2 is an x86_64 ELF and this host is aarch64, so AGP must NOT download
# its own aapt2 from Maven. Point it at the qemu wrapper in the workspace SDK instead.
android.aapt2FromMavenOverride=/root/project/remote-use/.toolchain/android-sdk/build-tools/34.0.0/aapt2
