# dsh-remote-gateway bundle patch —— 把网关插件行插入 profile 组合。
#
# 行按【包名】引用（不是相对路径）：patch 只贡献配置，不改变 loader 的基准目录。
# 安装：dsh plugin --profile web add /root/project/remote-use/dsh-remote-gateway
#
# 行级 inject 是必须的 —— 模块里 export 的 inject 管不到这一行。少任何一个，
# 启动时会报 "cannot get property xxx without inject" 并整棵树加载失败：
#   webServer  —— 读它真正的监听端口（dshPort: 0 时用它），并注册本地路由
#   connection —— 用 authenticatedUrl() 拿本进程的 launch token，去兑换 dsh 会话 cookie
- insert:
    - id: remote-gateway
      name: dsh-remote-gateway
      inject: [webServer, connection]
      config:
        # 网关监听地址与端口。隧道 ingress 指向这里，绝不指向 dsh 自己的 3080。
        #
        # 这里填**本机内网地址**而不是 127.0.0.1：cloudflared 的 Public Hostname
        # 里写 http://192.168.1.182:3081 一眼就能认出「这是网关」，不会和别的
        # 本地服务混淆。换机器/换网段时改这一行。
        #
        # 只允许回环或具体内网 IPv4；0.0.0.0 会被强制拉回 127.0.0.1（它会把服务
        # 一并挂到 docker0、VPN 等所有接口上）。dsh 自身始终只在回环。
        gatewayHost: 192.168.1.182
        gatewayPort: 3081
        # 0 = 自动采用 ctx.webServer.port（dsh 实际监听的端口）
        dshPort: 0
        # 公网域名[:端口]，仅用于日志与提示；例如 "dsh.example.com"
        publicAuthority: ''
        # 空 = 取 dsh 进程的工作目录
        workspaceRoot: ''
        # 明文密码仅用于首次引导，推荐改用 CLI 或环境变量写入 scrypt 哈希：
        #   DSH_GATEWAY_PASSWORD=... dsh --profile web
        #   npx dsh-remote-gateway set-password
        adminPassword: ''
        sessionMaxAgeDays: 30
        # Cloudflare 终结 TLS，浏览器看到的是 HTTPS，因此必须 Secure。
        # 本地 http 调试时置 false。
        cookieSecure: true
        maxUploadBytes: 2147483648
        # 反向代理**可重放**的请求体上限（字节）。默认 64 MiB。
        #
        # 为什么要管它：dsh 重启后会话 cookie 会失效，网关的处理是「换 cookie →
        # 把请求重放一次」。重放要求请求体还能再发一遍，而流一旦被消费就没了，
        # 所以只有被缓冲下来的体才可重放。调大 = 更多请求能自愈，代价是每个
        # 并发请求占这么多内存；调小 = 省内存，但更大的请求在 dsh 重启时会失败
        # （网关会明确返回 502 upstream_reauth_needed 让客户端重传，而不是悄悄
        # 发一个空体上去）。
        #
        # 注意：超过这个值的请求**仍然能正常上传**，只是改成流式转发、失去重放
        # 能力。真正决定能不能传的是 maxUploadBytes，不是这个值。
        replayBodyLimitBytes: 67108864
        loginMaxAttempts: 10
        loginWindowMs: 900000
        auditLog: true
